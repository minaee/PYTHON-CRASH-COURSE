{% extends 'base.html' %}

{% block content %}

    

    {% if topic %}
        <h1> Add a new entry for <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a> </h1>

        <form action="{% url 'learning_logs:new_entry' topic.id %}" method='post'>

            {% csrf_token %}
            {{ form.as_div }}

            <button name="submit">Add entry</button>

        </form>

    {% else %}
        <p>No topic selected.</p>
    {% endif %}
{% endblock content %}
