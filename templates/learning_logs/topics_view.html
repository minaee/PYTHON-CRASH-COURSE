{% extends 'base.html' %}

{% block content%}

<h1> Topics</h1>

<ul>
{% for item in topics %}
    <li> 
        <p> <a href="{% url 'learning_logs:topic' item.id %}">{{ item.text }}</a> added on {{ item.date_added }}</p>
        <a href="{% url 'learning_logs:entry-list' item.id %}">{{ item.text }}</a>
    </li>

    {% empty %}
    <li>No topics have been added yet.</li>

{% endfor %}
</ul>

{% endblock content %}
